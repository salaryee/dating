<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE3D5" />
      <stop offset="100%" stop-color="#C6A969" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#coffeeBg)" rx="32" />
  
  <!-- Desk surface texture -->
  <line x1="0" y1="260" x2="400" y2="260" stroke="#B89B5F" stroke-width="2" />
  
  <!-- Coffee Cup Saucer -->
  <ellipse cx="200" cy="270" rx="90" ry="24" fill="#D8D2C2" stroke="#B8B09F" stroke-width="3" />
  
  <!-- Coffee Cup -->
  <path d="M140,230 C140,265 170,275 200,275 C230,275 260,265 260,230 L260,190 L140,190 Z" fill="#FFFFFF" stroke="#D8D2C2" stroke-width="3" />
  <!-- Cup Handle -->
  <path d="M260,200 C285,200 285,240 260,245" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  <!-- Coffee liquid -->
  <ellipse cx="200" cy="195" rx="55" ry="14" fill="#6F4E37" />
  <ellipse cx="200" cy="195" rx="35" ry="9" fill="#8B5A2B" />
  <path d="M195,195 Q200,192 205,195" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.6" />
  
  <!-- Steam -->
  <path d="M185,170 Q180,150 190,135 Q200,120 190,105" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M215,165 Q225,145 215,130 Q205,115 215,100" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  
  <!-- Text Label -->
  <text x="200" y="340" font-family="sans-serif" font-size="16" font-weight="bold" fill="#594545" text-anchor="middle">커피와 책상 (사물 사진)</text>
</svg>
